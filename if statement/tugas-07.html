<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tugas If Statement</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body{
        background: linear-gradient(120deg,#1e3c72,#2a5298);
        min-height:100vh;
        color:white;
    }

    .box{
        background:white;
        color:black;
        padding:30px;
        border-radius:15px;
        box-shadow:0 5px 15px rgba(0,0,0,0.3);
        margin-top:60px;
    }

    .title{
        text-align:center;
        margin-bottom:25px;
    }
</style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="box">

                <h2 class="title">Aplikasi Aktivitas</h2>

                <form>

                    <!-- Pilih Aktivitas -->
                    <label class="form-label">Pilih Aktivitas</label>

                    <select class="form-select" id="aktivitas" onchange="pilihAktivitas()">
                        <option value="">-- Pilih Aktivitas --</option>
                        <option value="sarapan">Sarapan</option>
                        <option value="kerja">Berangkat Kerja</option>
                    </select>

                    <br>

                    <!-- Menu Sarapan -->
                    <div id="menuSarapan" style="display:none;">

                        <label class="form-label">Pilih Menu Sarapan</label>

                        <select class="form-select" id="menu">
                            <option value="">-- Pilih Menu --</option>
                            <option value="telur">Telur</option>
                            <option value="ikan">Ikan</option>
                            <option value="nugget">Nugget</option>
                            <option value="mie">Mie</option>
                        </select>

                        <br>

                    </div>

                    <!-- Tombol -->
                    <button type="button" class="btn btn-primary w-100" onclick="proses()">
                        Proses
                    </button>

                    <button type="reset" class="btn btn-secondary w-100 mt-2">
                        Reset
                    </button>

                </form>

                <!-- Hasil -->
                <div id="hasil" class="mt-4"></div>

            </div>

        </div>
    </div>
</div>

<script>

function pilihAktivitas(){

    let aktivitas = document.getElementById("aktivitas").value;

    if(aktivitas == "sarapan"){
        document.getElementById("menuSarapan").style.display = "block";
    }else{
        document.getElementById("menuSarapan").style.display = "none";
    }
}

function proses(){

    let aktivitas = document.getElementById("aktivitas").value;
    let hasil = document.getElementById("hasil");

    // IF SARAPAN
    if(aktivitas == "sarapan"){

        let menu = document.getElementById("menu").value;

        if(menu == "telur" || menu == "ikan" || menu == "nugget"){

            hasil.innerHTML =
            `
            <div class="alert alert-success">
                Bahan tersedia di rumah 🍳 <br>
                Silakan dimasak terlebih dahulu.
            </div>
            `;

        }else{

            hasil.innerHTML =
            `
            <div class="alert alert-danger">
                Bahan tidak tersedia 🛒 <br>
                Silakan beli bahan terlebih dahulu.
            </div>
            `;
        }
    }

    // IF BERANGKAT KERJA
    else if(aktivitas == "kerja"){

        let sekarang = new Date();

        let jam = sekarang.getHours();
        let menit = sekarang.getMinutes();

        if(jam > 8 || (jam == 8 && menit > 0)){

            hasil.innerHTML =
            `
            <div class="alert alert-danger">
                Anda TERLAMBAT masuk kerja ⏰ <br>
                Waktu sekarang : ${jam}:${menit}
            </div>
            `;

        }else{

            hasil.innerHTML =
            `
            <div class="alert alert-success">
                Anda belum terlambat 💼 <br>
                Waktu sekarang : ${jam}:${menit}
            </div>
            `;
        }
    }

    // JIKA BELUM PILIH
    else{

        hasil.innerHTML =
        `
        <div class="alert alert-warning">
            Silakan pilih aktivitas terlebih dahulu!
        </div>
        `;
    }
}

</script>

</body>
</html>
