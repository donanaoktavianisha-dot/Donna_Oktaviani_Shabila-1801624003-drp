<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Dashboard + Chess Game</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg,#eaf4ff,#8cc7ff);
    color:#1e2a44;
}

/* container */
.wrapper{
    max-width: 850px;
    margin:auto;
    padding:20px;
}

/* glass soft white */
.box{
    background:#ffffff;
    border:1px solid #67a9ff;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
    box-shadow:0 6px 18px rgba(0,0,0,0.05);
}

/* header */
.header{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:10px;
}

.greet{
    font-weight:600;
    color:#2563eb;
}

/* chess */
.board{
    display:grid;
    grid-template-columns: repeat(8,36px);
    justify-content:center;
    margin-top:8px;
    gap:1px;
}

.cell{
    width:36px;
    height:36px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
    cursor:pointer;
    transition:0.15s;
}

.cell:hover{
    transform:scale(1.08);
}

/* activity card */
.card{
    background:#f1f7ff;
    border-left:4px solid #79b7fe;
    padding:10px;
    border-radius:10px;
    margin-top:8px;
    font-size:13px;
}

/* button style override */
.btn-primary{
    background:#60a5fa;
    border:none;
}
.btn-primary:hover{
    background:#3b82f6;
}

/* toast */
.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#071a31;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    display:none;
    font-size:13px;
}
</style>
</head>

<body>

<div class="wrapper">

    <!-- HEADER -->
    <div class="header">
        <div class="greet" id="greet"></div>
        <div>🕒 <span id="clock"></span></div>
    </div>

    <!-- CHESS -->
    <div class="box">
        <b>♟ Chess Mini Game</b><br>
        <small style="color:#64748b">Klik kotak jika Game Mode aktif</small><br>

        <button class="btn btn-sm btn-primary mt-2" onclick="toggleMode()">
            Toggle Game Mode
        </button>

        <div id="board" class="board"></div>
    </div>

    <!-- INPUT -->
    <div class="box">
        <b>📌 Activity Tracker</b>

        <input id="act" class="form-control mt-2" placeholder="Aktivitas">
        <input id="detail" class="form-control mt-2" placeholder="Detail aktivitas">

        <div class="row mt-2">
            <div class="col">
                <label style="font-size:12px">Jam Mulai</label>
                <input id="start" type="time" class="form-control">
            </div>
            <div class="col">
                <label style="font-size:12px">Jam Selesai</label>
                <input id="end" type="time" class="form-control">
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-3" onclick="add()">
            Tambah Aktivitas
        </button>
    </div>

    <!-- OUTPUT -->
    <div class="box">
        <b>🧾 Aktivitas Kamu</b>
        <div id="out"></div>
    </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

let data = [];
let gameMode = false;

/* CLOCK */
function clock(){
    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString("id-ID");
}
setInterval(clock,1000);
clock();

/* GREETING */
function greet(){
    let h = new Date().getHours();
    let g="";

    if(h<11) g="Selamat Pagi ☀️";
    else if(h<15) g="Selamat Siang 🌤";
    else if(h<18) g="Selamat Sore 🌤";
    else g="Selamat Malam 🌙";

    document.getElementById("greet").innerText = g;
}
greet();

/* CHESS */
function board(){
    let el=document.getElementById("board");
    el.innerHTML="";

    for(let i=0;i<8;i++){
        for(let j=0;j<8;j++){

            let d=document.createElement("div");
            d.classList.add("cell");

            d.innerHTML = (i+j)%2==0 ? "⬜" : "⬛";

            d.onclick=()=>{
                if(!gameMode) return;
                d.innerHTML = (d.innerHTML=="⬛") ? "⬜" : "⬛";
            };

            el.appendChild(d);
        }
    }
}

function toggleMode(){
    gameMode = !gameMode;
    showToast(gameMode ? "Game ON 🎮" : "Game OFF");
}

/* ACTIVITY */
function add(){

    let a=document.getElementById("act").value;
    let d=document.getElementById("detail").value;
    let s=document.getElementById("start").value;
    let e=document.getElementById("end").value;

    if(!a||!d){
        showToast("Isi lengkap!");
        return;
    }

    data.push({
        a,d,s,e,
        time:new Date().toLocaleTimeString("id-ID")
    });

    document.getElementById("act").value="";
    document.getElementById("detail").value="";

    render();
    showToast("Tersimpan ✔");
}

/* RENDER */
function render(){

    let out="";

    data.forEach(x=>{
        out+=`
        <div class="card">
            <b>${x.a}</b><br>
            ${x.d}<br>
            ⏱ ${x.s || "--"} - ${x.e || "--"}<br>
            🕒 ${x.time}
        </div>`;
    });

    document.getElementById("out").innerHTML=
        out || "<small>Belum ada aktivitas</small>";
}

/* TOAST */
function showToast(msg){
    let t=document.getElementById("toast");
    t.innerText=msg;
    t.style.display="block";

    setTimeout(()=>t.style.display="none",1500);
}

/* INIT */
board();

</script>

</body>
</html>
